# Alembic configuration for repo/'s own three security-critical repository
# tables (P16) -- a SEPARATE migration history from aegle-phr's own
# alembic/ chain, even though both point at the same Postgres instance and
# database. Postgres doesn't care that two independent Alembic chains
# manage different tables in the same database, as long as neither touches
# the other's tables -- confirmed no name collision against
# aegle_phr/models.py before this was set up (repo/'s tables are
# patient_identities, consents, hiu_consents; aegle_phr's are callback_log,
# abdm_call_log, subscription_request, uil_link_request).
#
# NOTE: sqlalchemy.url is deliberately absent here, same reasoning as
# aegle-phr/alembic.ini's own header comment -- the URL is supplied at
# runtime by alembic/env.py, which reads it from server.config.DATABASE_URL
# (i.e. from repo/.env). Hardcoding a database URL here would put
# infrastructure config in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames get a UTC timestamp prefix so they sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
